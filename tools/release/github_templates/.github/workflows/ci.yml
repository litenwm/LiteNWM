name: CPU smoke test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python examples/run_pipeline.py --demo
      - run: python -m pytest -q tests/recon_latents/test_ltwm_horizon.py tests/scoring/test_trajectory_quality_scorer_v2.py tests/planning/test_trajectory_constraints.py
